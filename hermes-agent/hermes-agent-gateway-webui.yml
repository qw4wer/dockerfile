version: '3.8'

services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    command: gateway run
    restart: unless-stopped
    ports:
      - "8645:8645"  
      - "8642:8642"   
      - "9119:9119"         

    volumes:

      - /data/docker-data/hermes:/home/agent/.hermes

      - /data/docker-data/hermes-workspace:/hermes-workspace
    environment:
      - HERMES_HOME=/home/agent/.hermes
      - COOKIE_SECURE=0
      - HERMES_DASHBOARD=1


  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    restart: unless-stopped
    ports:
      - "8787:8787"   
    depends_on:
      - hermes-agent
    volumes:

      - /data/docker-data/hermes:/home/hermeswebui/.hermes

      - hermes-venv:/opt/hermes/.venv

      - /data/docker-data/hermes-workspace:/hermes-workspace
    environment:
      - UPSTREAM=http://hermes-agent:8642
      - HERMES_BIN=/opt/hermes/.venv/bin/hermes
      - HERMES_HOME=/home/hermeswebui/.hermes
      - HERMES_API_TOKEN=16ff487cb10fa27e70750939a976df5514550238
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui


# 创建一个匿名卷来存放 hermes 的虚拟环境，确保 webui 能访问到所有 Python 依赖
volumes:
  hermes-venv:
    driver: local
    driver_opts:
      type: none
      device: /data/docker-data/hermes/venv  # 如果希望持久化虚拟环境到宿主机，可取消注释并创建该目录
      o: bind