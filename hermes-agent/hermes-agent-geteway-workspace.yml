services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    container_name: hermes-agent
    command: gateway run 
    ports:
      - "8645:8645"   
      - "8642:8642"            
    volumes:
      - /data/docker-data/hermes:/opt/data 
      - /data/docker-data/hermes-workspace:/hermes-workspace  
    environment:
      HERMES_HOME=/opt/data    
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: '9119'

  hermes-workspace:
    image: ghcr.io/outsourc-e/hermes-workspace:latest
    restart: unless-stopped
    env_file:
      - /data/docker-data/hermes/.env
    environment:
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      HERMES_API_URL: http://hermes-agent:8642
      HERMES_DASHBOARD_URL: http://hermes-agent:9119

      HERMES_API_TOKEN: ${API_SERVER_KEY:-}

      HERMES_PASSWORD: ${HERMES_PASSWORD:-${CLAUDE_PASSWORD:-}}

      COOKIE_SECURE: ${COOKIE_SECURE:-}

      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - /data/docker-data/hermes:/home/workspace/.hermes
      - /data/docker-data/hermes-workspace:/workspace
    ports:
      - '23000:3000'